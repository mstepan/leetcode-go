name: LeetCode Go CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fmt
        run: |
          make fmt
          git diff --exit-code -- '*.go'

      - name: build
        run: make build

      - name: lint
        run: make lint

      - name: test
        run: make test
